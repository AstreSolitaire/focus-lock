# 注意：不要在 jvmargs 里加 -Dfile.encoding=UTF-8。
# 中文 Windows 的系统 ANSI 代码页是 GBK，Gradle 在 UTF-8 下写出的测试 worker
# 参数文件会被 JVM 按 GBK 解析，路径乱码后报
# ClassNotFoundException: worker.gradle.process.internal.worker.GradleWorkerMain。
# Kotlin 源码默认就按 UTF-8 编译，不需要这个开关。
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# 本项目所在路径含中文（Windows 用户目录），AGP 默认会拒绝构建。
# 纯 Kotlin/Java 项目开这个开关通常可以正常编译；若遇到 aapt2 报错，
# 把整个 focus-lock 目录挪到纯英文路径（如 D:\dev\focus-lock）即可。
android.overridePathCheck=true

kotlin.code.style=official
